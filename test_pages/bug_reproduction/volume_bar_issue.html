<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QPlayer — Embed and Size Comparison</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #172e45;
      background: #eef3f7;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 24px;
      line-height: 1.5;
    }

    nav a {
      display: inline-block;
      padding: 10px 16px;
      margin-right: 8px;
      background: #174f85;
      color: white;
    }

    nav a[aria-current="page"] {
      background: #6a3583;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 20px;
    }

    select {
      padding: 8px;
      font: inherit;
    }

    .scroll-container {
      overflow-x: auto;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      width: 820px;
      margin: auto;
    }

    section {
      min-width: 0;
    }

    h2 {
      margin: 0;
      padding: 12px;
      background: #174f85;
      color: white;
      font-size: 20px;
    }

    .player-slot {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #101820;
    }

    .legacy-embed,
    qplayer-embed {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <header>
    <h1>QPlayer comparison — <span id="build"></span></h1>

    <p>
      Left: legacy 1.0 div embed.
      Right: modern 1.1 web component.
      Both use the same video, preset and player width.
    </p>

    <nav>
      <a id="production-link" href="?channel=production">
        Test production
      </a>

      <a id="beta-link" href="?channel=beta">
        Test beta
      </a>
    </nav>

    <p>
      Switching builds reloads both players and keeps the selected width.
    </p>

    <label for="size">Width of each player</label>

    <select id="size">
      <option value="400">400px</option>
      <option value="500">500px</option>
    </select>

    <p id="status" role="status">Loading players…</p>
  </header>

  <div class="scroll-container">
    <main class="players" id="players">

      <!-- LEFT: LEGACY 1.0 DIV EMBED -->
      <section>
        <h2 id="legacy-label">1.0 — Legacy div</h2>

        <div class="player-slot">
          <div
            class="legacy-embed"
            title="Legacy 1.0 player"
            data-qplayer-id="legacy-player"
            data-qplayer-account-id="AccNqtD2CsWD0Su3cmykHVzZQ"
            data-qplayer-media-id="293cc958-31a3-4119-9cfa-8779cf97af93"
            data-qplayer-preset-id="875ec0da-13d8-49c9-b97b-dc8f3e03fcb3"
            data-qplayer-inline="on"
            data-qplayer-auto-sizing="true"
            data-qplayer-autoplay="false"
            data-qplayer-repeat="false"
            data-qplayer-analytics="off"
          ></div>
        </div>
      </section>

      <!-- RIGHT: MODERN 1.1 WEB COMPONENT -->
      <section>
        <h2 id="modern-label">1.1 — Web component</h2>

        <div class="player-slot">
          <qplayer-embed
            title="Modern 1.1 player"
            data-qplayer-id="modern-player"
            data-qplayer-account-id="AccNqtD2CsWD0Su3cmykHVzZQ"
            data-qplayer-media-id="293cc958-31a3-4119-9cfa-8779cf97af93"
            data-qplayer-preset-id="875ec0da-13d8-49c9-b97b-dc8f3e03fcb3"
            data-qplayer-auto-sizing="true"
            data-qplayer-autoplay="false"
            data-qplayer-repeat="false"
            data-qplayer-analytics="off"
          ></qplayer-embed>
        </div>
      </section>

    </main>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    const channel = params.get("channel") === "production"
      ? "production"
      : "beta";

    const playerPath = channel === "production"
      ? "qplayer"
      : "qplayer-beta";

    const status = document.getElementById("status");
    const sizeSelect = document.getElementById("size");

    document.getElementById("build").textContent =
      channel.toUpperCase();

    document.getElementById("legacy-label").textContent =
      "1.0 — Legacy div — " + channel;

    document.getElementById("modern-label").textContent =
      "1.1 — Web component — " + channel;

    document.querySelector(".legacy-embed").setAttribute(
      "data-qplayer-beta",
      String(channel === "beta")
    );

    sizeSelect.value = params.get("size") === "500"
      ? "500"
      : "400";

    function applySize() {
      const width = Number(sizeSelect.value);

      // Two equally sized players, separated by a 20px gap.
      document.getElementById("players").style.width =
        (width * 2 + 20) + "px";

      for (const build of ["production", "beta"]) {
        const link = document.getElementById(build + "-link");
        const url = new URL(location.href);

        url.searchParams.set("channel", build);
        url.searchParams.set("size", String(width));

        link.href = url.href;

        if (build === channel) {
          link.setAttribute("aria-current", "page");
        }
      }

      const currentUrl = new URL(location.href);
      currentUrl.searchParams.set("size", String(width));

      history.replaceState(null, "", currentUrl);
    }

    sizeSelect.addEventListener("change", applySize);
    applySize();

    // Temporarily detach the modern embed so the legacy loader
    // does not process it during its scan of the page.
    const modernPlayer = document.querySelector("qplayer-embed");
    const modernSlot = modernPlayer.parentElement;

    modernPlayer.remove();

    // Load the selected modern SDK.
    const sdk = document.createElement("script");

    sdk.src =
      "https://play2.qbrick.com/" +
      playerPath +
      "/qplayer.min.js";

    sdk.onload = function () {
      // Load the matching legacy loader.
      const loader = document.createElement("script");

      loader.src =
        "https://play2.qbrick.com/" +
        playerPath +
        "/loader/qplayer-loader.min.js";

      loader.onload = function () {
        modernSlot.append(modernPlayer);

        status.textContent =
          "Both embed scripts loaded. Press Play on each player.";
      };

      loader.onerror = function () {
        status.textContent = "The legacy loader could not load.";
      };

      document.head.append(loader);
    };

    sdk.onerror = function () {
      status.textContent = "The player SDK could not load.";
    };

    document.head.append(sdk);
  </script>
</body>
</html>
