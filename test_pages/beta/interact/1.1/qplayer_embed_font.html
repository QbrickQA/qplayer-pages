<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Player Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p {
            margin-bottom: 24px;
            color: #666;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Interactive Player Test</h1>

    <p>
        Embedded player test page for validating multiple On Click actions.
    </p>

    <div class="player-wrapper">
       <qplayer-embed title="Regression Project Interact"
       data-qplayer-id="qplayer-7cb9c9"
       data-qplayer-account-id="AccNqtD2CsWD0Su3cmykHVzZQ"
       data-qplayer-scenario-id="572590ae-ce17-4197-8dec-72637a46ac21"
       data-qplayer-preset-id="3f25f78f-106c-44b0-b6a0-1dbca12f50d3"
       data-qplayer-aspect-ratio="16/9"> 
       </qplayer-embed>
<script src="https://play2.qbrick.com/qplayer-beta/qplayer.min.js"></script>
    </div>

</div>

</body>
</html>
