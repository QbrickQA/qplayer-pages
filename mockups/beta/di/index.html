<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kvartalspresentationer – QA Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        /* Simple DI-like top bar */

        .site-header {
            width: 100%;
            border-bottom: 1px solid #d5d5d5;
            background: #ffffff;
        }

        .site-header__inner {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 20px;
        }

        .site-header__logo {
            font-size: 24px;
            font-weight: 700;
        }

        /* Main content area */

        .ir-content-page {
            width: 100%;
        }

        .ir-content-page__content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Intro section */

        .ir-content-page__header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 40px;
        }

        .ir-content-page__header-text {
            max-width: 720px;
        }

        .ir-content-page__header h1 {
            margin: 0 0 12px;
            font-size: 40px;
            line-height: 1.05;
        }

        .ir-content-page__header p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }

        .ir-content-page__header-link {
            flex-shrink: 0;
            color: #111111;
        }

        /*
         * Actual Qbrick widget area.
         *
         * Do NOT add font, letter-spacing, overflow or heading
         * styling here. We want those properties to come from
         * the widget itself so they can be tested properly.
         */

        .ir-content-page__bac-content {
            width: 100%;
        }

        /* Mobile */

        @media (max-width: 767px) {

            .site-header__inner {
                padding: 16px;
            }

            .ir-content-page__content {
                padding: 24px 16px 60px;
            }

            .ir-content-page__header {
                display: block;
                margin-bottom: 24px;
            }

            .ir-content-page__header h1 {
                font-size: 32px;
            }

            .ir-content-page__header p {
                font-size: 17px;
            }

            .ir-content-page__header-link {
                display: inline-block;
                margin-top: 20px;
            }
        }
    </style>
</head>


<body>

    <!-- Fake host-page header -->

    <header class="site-header">

        <div class="site-header__inner">

            <div class="site-header__logo">
                DI – QA Test
            </div>

        </div>

    </header>


    <!-- Customer-page-like structure -->

    <main class="ir-content-page">

        <div class="ir-content-page__content">


            <!-- Page heading -->

            <header class="ir-content-page__header">

                <div class="ir-content-page__header-text">

                    <h1>
                        Kvartalspresentationer
                    </h1>

                    <p>
                        Kvartalspresentationer och annan
                        investerarkommunikation från noterade bolag.
                        En del av Di Investor Relations.
                    </p>

                </div>


                <!-- Link to our separate article test page -->

                <a
                    class="ir-content-page__header-link"
                    href="article.html">
                    Öppna artikelsida →
                </a>

            </header>


            <!-- ========================================= -->
            <!-- ACTUAL IR-MAIN BETA WIDGET                -->
            <!-- ========================================= -->

            <div class="ir-content-page__bac-content">

                <ir-main id="mainPage"></ir-main>

                <script
                    data-di-container-id="mainPage"
                    src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                </script>

            </div>


        </div>

    </main>

</body>

</html>
