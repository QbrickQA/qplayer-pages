<html lang="sv">

    <title>Kvartalspresentationer – QA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;

        .site-header {

        .site-header__inner,

        }

        .page-header__text {

        }

            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }

        .page-header a {
            white-space: nowrap;
            color: inherit;
        }

        @media (max-width: 767px) {
            .page {
                padding: 24px 16px;
            }

            .page-header {
                display: block;
                margin-bottom: 24px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .page-header a {
