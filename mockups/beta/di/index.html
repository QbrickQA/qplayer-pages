<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kvartalspresentationer – QA Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: #fff;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /*
         * Host-page content.
         * No styling is applied to the Qbrick widget itself.
         */
        .page {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 40px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .page-header__title {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        .page-header__marker {
            width: 14px;
            height: 14px;
            background: #b51217;
        }

        .page-header h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.1;
            font-weight: 700;
        }

        .page-header p {
            max-width: 400px;
            margin: 0;
            color: #777;
            font-size: 12px;
            line-height: 1.3;
        }

        /*
         * Qbrick widget container.
         * Intentionally no font, letter-spacing, height,
         * overflow or other widget-specific styling.
         */
        .widget-container {
            width: 100%;
        }

        @media (max-width: 767px) {
            .page {
                padding: 20px 16px;
            }

            .page-header {
                display: block;
            }

            .page-header__title {
                margin-bottom: 10px;
            }

            .page-header h1 {
                font-size: 22px;
            }

            .page-header p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- Normal customer/host-page HTML -->

        <header class="page-header">

            <div class="page-header__title">
                <span class="page-header__marker"></span>

                <h1>
                    Kvartalspresentationer
                </h1>
            </div>

            <p>
                Kvartalspresentationer och annan investerarkommunikation
                från noterade bolag. En del av Di Investor Relations.
            </p>

        </header>


        <!-- ============================================= -->
        <!-- ACTUAL IR-MAIN BETA WIDGET                    -->
        <!-- ============================================= -->

        <div class="widget-container">

            <ir-main id="mainPage"></ir-main>

            <script
                data-di-container-id="mainPage"
                src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
            </script>

        </div>

    </main>

</body>

</html>
