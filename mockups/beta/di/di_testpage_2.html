<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DI Widget QA Test</title>

    <style>
        /*
         * Minimal host-page styling.
         * Intended to approximate the content-column environment
         * without modifying the widgets themselves.
         */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        .page-header {
            border-bottom: 1px solid #ddd;
            padding: 16px 20px;
        }

        .page-header__inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header h1 {
            margin: 0;
            font-size: 20px;
        }

        .page {
            width: 100%;
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .widget-section {
            margin-bottom: 64px;
        }

        .test-label {
            margin: 0 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;

            font-size: 14px;
            font-weight: 700;
        }

        /*
         * Keep the widgets themselves untouched.
         * This container only controls where they sit on the page.
         */
        .widget-container {
            width: 100%;
        }

        @media (max-width: 767px) {
            .content {
                padding: 20px 16px;
            }

            .widget-section {
                margin-bottom: 40px;
            }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <div class="page-header__inner">
            <h1>DI Widget QA Test</h1>
        </div>
    </header>

    <main class="page">

        <div class="content">

            <!-- MAIN PAGE -->
            <section class="widget-section">
                <p class="test-label">ir-main</p>

                <div class="widget-container">
                    <ir-main id="mainPage"></ir-main>

                    <script
                        data-di-container-id="mainPage"
                        src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                    </script>
                </div>
            </section>


            <!-- LINK BOX -->
            <section class="widget-section">
                <p class="test-label">ir-linkbox</p>

                <div class="widget-container">
                    <ir-linkbox id="linkBox"></ir-linkbox>

                    <script
                        data-di-container-id="linkBox"
                        src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                    </script>
                </div>
            </section>


            <!-- COMPANY CARD -->
            <section class="widget-section">
                <p class="test-label">ir-card</p>

                <div class="widget-container">
                    <ir-card
                        id="companyCard"
                        data-di-company="qbrick-5500585">
                    </ir-card>

                    <script
                        data-di-container-id="companyCard"
                        src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                    </script>
                </div>
            </section>

        </div>

    </main>

</body>
</html>
