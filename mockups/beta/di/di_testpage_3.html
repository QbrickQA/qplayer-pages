<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DI Widget QA Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        /*
         * Full-width widget at the top of the page,
         * matching the general structure of the customer page.
         */
        .linkbox-section {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /*
         * Remaining page content is constrained.
         */
        .content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .widget-section {
            margin-bottom: 64px;
        }

        .test-label {
            margin: 0 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            font-weight: 700;
        }

        .widget-container {
            width: 100%;
        }

        @media (max-width: 767px) {
            .content {
                padding: 20px 16px;
            }

            .widget-section {
                margin-bottom: 40px;
            }
        }
    </style>
</head>

<body>

    <!--
        FULL-WIDTH LINKBOX
        This intentionally sits directly under <body>
        so no content wrapper limits its width.
    -->
    <section class="linkbox-section">

        <ir-linkbox id="linkBox"></ir-linkbox>

        <script
            data-di-container-id="linkBox"
            src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
        </script>

    </section>


    <!-- REST OF PAGE -->
    <main class="content">

        <!-- MAIN PAGE -->
        <section class="widget-section">

            <p class="test-label">ir-main</p>

            <div class="widget-container">

                <ir-main id="mainPage"></ir-main>

                <script
                    data-di-container-id="mainPage"
                    src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                </script>

            </div>

        </section>


        <!-- COMPANY CARD -->
        <section class="widget-section">

            <p class="test-label">ir-card</p>

            <div class="widget-container">

                <ir-card
                    id="companyCard"
                    data-di-company="qbrick-5500585">
                </ir-card>

                <script
                    data-di-container-id="companyCard"
                    src="https://play2.qbrick.com/di-loader-beta/irLoader.js">
                </script>

            </div>

        </section>

    </main>

</body>
</html>
